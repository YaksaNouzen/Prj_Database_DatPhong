services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Tạo .env từ .env.example}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["python", "-m", "database.bootstrap"]
    environment:
      DB_HOST: sqlserver
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Tạo .env từ .env.example}
      HOTEL_APP_PASSWORD: ${HOTEL_APP_PASSWORD:?Tạo .env từ .env.example}
    depends_on:
      sqlserver:
        condition: service_healthy

  app:
    build: .
    environment:
      DB_HOST: sqlserver
      DB_USER: hotel_app
      DB_PASSWORD: ${HOTEL_APP_PASSWORD:?Tạo .env từ .env.example}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  sqlserver-data:
